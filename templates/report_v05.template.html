<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malaria Molecular Surveillance — Senegal (__ASSAY__)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#006dae; --surface:#fff; --page:#eef1f4; --panel:#f7f9fb;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e6e8eb; --line:#dfe1e5;
  --good:#0ca30c; --amber:#e8a400; --red:#d03b3b; --grey:#9a9a9a;
  --s1:#2a78d6; --s2:#1baf7a;
  --radius:12px; --font:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--page)}
body{font-family:var(--font);color:var(--ink);background:var(--page);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px 80px}
header.top{color:#fff;padding:22px 0 18px;background:linear-gradient(120deg,#003b5e 0%,var(--accent) 60%,#2494c7 100%)}
.top .wrap{padding-bottom:0}
.brandrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crest{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;border:1px solid rgba(255,255,255,.28)}
.brandrow h1{font-size:20px;font-weight:600}
.assaychip{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;margin-left:4px}
.sub{font-size:12.5px;opacity:.92}
.tagline{margin-top:12px;display:flex;gap:22px;flex-wrap:wrap;font-size:12px;opacity:.95}
.tagline b{font-weight:600}
.badge{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:2px 9px;border-radius:20px;font-size:11.5px}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.04)}
nav.tabs .wrap{display:flex;gap:2px;padding-top:0;padding-bottom:0;overflow-x:auto;align-items:center}
.tabbtn{appearance:none;background:none;border:none;font-family:inherit;cursor:pointer;padding:13px 14px;font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap;border-bottom:3px solid transparent}
.tabbtn:hover{color:var(--ink)} .tabbtn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabsep{color:var(--line);padding:0 2px}
.tab-page{display:none;padding-top:22px}.tab-page.active{display:block}
h2.sec{font-size:18px;font-weight:600;margin:6px 0 4px}
.sec-desc{color:var(--ink2);font-size:13.5px;margin-bottom:14px}
.grid{display:grid;gap:16px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
.grid>*{min-width:0}   /* let wide tables scroll inside .scroll instead of stretching the grid */
.card{min-width:0}
@media(max-width:860px){.two,.three{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h3{font-size:14.5px;font-weight:600;margin-bottom:2px}
.card .hint{font-size:12px;color:var(--muted);margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;position:relative;overflow:hidden}
.kpi .lab{font-size:12px;color:var(--ink2);font-weight:500}
.kpi .val{font-size:27px;font-weight:600;margin-top:5px;letter-spacing:-.5px}
.kpi .foot{font-size:11.5px;margin-top:6px;color:var(--ink2)}
.kpi .scope{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
/* stoplight */
.stoplight{display:grid;grid-template-columns:1fr;gap:16px}
.light{border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;background:#fff;border-left:6px solid var(--grey)}
.light:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.light.red{border-left-color:var(--red)} .light.amber{border-left-color:var(--amber)}
.light.green{border-left-color:var(--good)} .light.grey{border-left-color:var(--grey)}
.light .dot{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:8px}
.light.red .dot{background:var(--red)} .light.amber .dot{background:var(--amber)}
.light.green .dot{background:var(--good)} .light.grey .dot{background:var(--grey)}
.light .cat{font-size:15px;font-weight:600}
.light .stat{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;color:var(--ink2)}
.light ul{margin:10px 0 0 2px;padding:0;list-style:none;font-size:12.5px;color:var(--ink2)}
.light li{padding:3px 0;border-top:1px dashed var(--grid)}
.callout{border-left:4px solid var(--accent);background:var(--panel);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--ink2);margin:8px 0}
.callout.red{border-left-color:var(--red)} .callout.amber{border-left-color:var(--amber)}
.callout b{color:var(--ink)}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
.pill.who{background:#e3eefb;color:#1c5cab} .pill.research{background:#fdf0e2;color:#9a5b16;border:1px solid #eccfa6}
.pill.cand{background:#eef4fc;color:#2a6fb0;border:1px solid #cfe0f4} .pill.pot{background:#f4f7fb;color:#4a6d92;border:1px solid #dde6f0}
.pill.bg{background:#f1f2f4;color:#5b6067;border:1px solid #dcdfe3}
.pill.hap{background:#eef7f2;color:#1f6b4a;border:1px solid #cfe8dc}
.pill.ag{background:#f3eefa;color:#5b3d8f;border:1px solid #ddd0ee}
a.pill:hover{filter:brightness(0.96)}
.clshead{font-size:12px;color:var(--ink2);margin:0 0 14px}
.pill.action{background:#fbe3e3;color:#a81e1e} .pill.mut{background:#eef1f4;color:#52514e}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--grid)}
th{font-weight:600;color:var(--ink2);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#fafbfc} .ci-txt{color:var(--muted);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
caption,.tcap{caption-side:bottom;text-align:left;color:var(--muted);font-size:11.5px;padding-top:8px}
.tcap{display:block;padding-top:18px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:8px 0 2px;align-items:center}
.legend .k{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:13px;height:13px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.08)}
.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:12.5px}
select,input[type=range],button.btn{font-family:inherit}
select{font-size:12.5px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
button.btn{font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;color:var(--ink)}
button.btn:hover{background:var(--panel)} button.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.toggles{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin:4px 0 10px}
.toggles label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
/* marker toggles: one block per gene, chips on a fixed column grid so they line up */
.tgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px;margin:4px 0 14px}
.tgroup{border:1px solid var(--grid);border-radius:9px;padding:9px 11px;background:var(--panel)}
.tglab{font-size:12px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:8px;margin-bottom:7px}
.tglab .tgn{font-weight:400;color:var(--muted)} .tglab .tgacts{margin-left:auto;white-space:nowrap}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:3px 12px}
.tgrid label{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;white-space:nowrap}
.tgrid label .aa{font-variant-numeric:tabular-nums}
.tgrid label .pill{margin-left:auto}
button.lnk{background:none;border:none;color:#2a6fb0;font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0 1px;font-family:inherit}
.clslegend{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:5px 18px;font-size:12px;color:var(--ink2);margin:0 0 14px}
.clslegend .k{display:flex;gap:7px;align-items:baseline}
.clslegend .k .pill{flex:none}
/* trends: stepper + scope chips */
.stepbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 8px}
.stepbar .frame{font-size:14px;font-weight:600;min-width:9ch;text-align:center;font-variant-numeric:tabular-nums}
.stepbar .sub{font-size:11.5px;color:var(--muted)}
button.step{font-family:inherit;font-size:14px;line-height:1;padding:5px 11px;border:1px solid var(--line);
  border-radius:7px;background:#fff;cursor:pointer;color:var(--ink)}
button.step:hover:not(:disabled){background:var(--panel)}
button.step:disabled{opacity:.4;cursor:default}
button.step.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.scopechip{font-size:11.5px;background:#e3eefb;color:#1c5cab;border-radius:20px;padding:2px 10px;font-weight:600}
/* a filtered (non-pooled) view gets a different colour so it cannot be mistaken for the pooled one */
.scopechip.filtered{background:#fdf0e2;color:#9a5b16;border:1px solid #eccfa6}
.sub2{font-size:10.5px;color:var(--muted);font-weight:400;margin-top:3px;line-height:1.35;white-space:normal}
.sub2 b{color:var(--ink2);font-weight:600}
.scopebar{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:12px;color:var(--ink2);
  background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:8px 11px;margin:10px 0 4px}
.scopebar b{color:var(--ink)}
.yrnote{font-size:12px;color:var(--ink2);margin:6px 0 0}
.yrnote b{color:var(--ink)}
#trmap svg, #drmap svg{transition:none}
.readout{font-size:12.5px;color:var(--ink2);min-height:1.4em;margin-top:4px}
.readout b{color:var(--ink)}
.greyed{opacity:.45;filter:grayscale(1)}
.unvalidated{border:2px solid var(--red);background:#fbe9e9;border-radius:10px;padding:12px 14px;font-size:13px;color:#7a1a1a;margin-bottom:14px}
.unvalidated b{color:#5a0f0f}
svg{display:block;max-width:100%}text{font-family:var(--font)}
.mockwarn{background:#fff3d6;color:#7a5600;text-align:center;font-size:12.5px;padding:6px;font-weight:500;border-bottom:1px solid #f0dca0}
.realbanner{background:#e6f4ea;color:#1f6b3b;text-align:center;font-size:12.5px;padding:6px;font-weight:600;border-bottom:1px solid #b7dfc2}
.dlmodal{position:fixed;inset:0;background:rgba(20,24,30,.45);display:none;align-items:center;justify-content:center;z-index:9999}
.dlbox{background:#fff;border-radius:10px;padding:20px 26px;min-width:320px;box-shadow:0 10px 40px rgba(0,0,0,.3);font-size:14px}
.dllab{margin-bottom:10px;color:#1a1d22;font-weight:600}
.dlbar{height:10px;background:#eef1f4;border-radius:6px;overflow:hidden}
.dlbar i{display:block;height:100%;width:0;background:#2a6fb0;transition:width .2s}
.footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.region-sel{stroke:#111 !important;stroke-width:2 !important}
tr.region-sel td{background:#e8f1fb !important}
a{color:var(--accent)}
@media print{nav.tabs{display:none}.tab-page{display:block !important;page-break-before:always}.tab-page:first-of-type{page-break-before:avoid}header.top{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff}}
</style>
</head>
<body>
<div id="mockwarn" class="mockwarn"></div>
<header class="top"><div class="wrap">
  <div class="brandrow"><div class="crest">Pf</div>
    <div><h1>Malaria Molecular Surveillance — Senegal <span class="assaychip" id="assaychip"></span></h1>
      <div class="sub" id="h-sub"></div></div></div>
  <div class="tagline" id="h-tags"></div>
</div></header>
<nav class="tabs"><div class="wrap" id="tabbar"></div></nav>
<div class="wrap" id="pages"></div>
<div class="wrap"><div class="footer" id="footer"></div></div>

<script>
/*DATA_HERE*/
</script>
<script>
const D=DATA, M=D.meta, CAP=D.capabilities;
const REAL=!!M.real;
document.documentElement.style.setProperty('--accent', M.color||'#006dae');
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>(v==null?'—':(+v).toFixed(1)+'%');
const ci=(lo,hi)=>`[${(+lo).toFixed(1)}–${(+hi).toFixed(1)}]`;
const nf=n=>(+n).toLocaleString();
const unit=n=>D.units.find(u=>u.name===n);
const isComb=M.assay==='COMBINED';
let MINN=M.min_samples;                 // live suppression threshold (slider)

/* ---- binned color ---- */
const RED=['#fdeaea','#f7c7c7','#ef9a9a','#e26565','#d03b3b','#9e2020'];
const BLU=['#eaf2fb','#c8ddf6','#9ec5f4','#6da7ec','#3987e5','#1c5cab'];
function binColor(v,breaks,cols){ if(v==null) return null;
  for(let i=1;i<breaks.length;i++){ if(v<breaks[i]) return cols[Math.min(i-1,cols.length-1)]; }
  return cols[cols.length-1]; }
function binnedLegend(breaks,cols,u,actionAt,showSupp=true){
  let s=`<div class="legend">`;
  for(let i=0;i<breaks.length-1;i++){
    const lab = breaks[i]+(breaks[i+1]>=1e9?'+':'–'+breaks[i+1])+(u||'');
    const act = (actionAt!=null && breaks[i+1]===actionAt) ? ' ⚑' : '';
    s+=`<span class="k"><span class="sw" style="background:${cols[i]}"></span>${lab}${act}</span>`;
  }
  if(showSupp) s+=`<span class="k"><span class="sw" style="background:repeating-linear-gradient(45deg,#f1f3f6,#f1f3f6 3px,#d5d9de 3px,#d5d9de 4px)"></span>n&lt;${MINN} (suppressed)</span>`;
  return s+`</div>`;
}
/* ---- choropleth (binned, clickable, sample-suppressed) ---- */
let _cid=0;
function choropleth(valFn,nFn,breaks,cols,u,{labelTop=0}={}){
  const m=D.map, pid='nd'+(_cid++); let s=`<svg viewBox="${m.viewBox}" width="${m.W}" role="img">`;
  s+=`<defs><pattern id="${pid}" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f1f3f6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d5d9de" stroke-width="1.4"/></pattern></defs>`;
  m.depts.forEach(dp=>{const u0=unit(dp.name),n=nFn(u0),v=valFn(u0);
    const supp = (n==null||n<MINN);
    const fill = supp? `url(#${pid})` : (binColor(v,breaks,cols)||'#f1f3f6');
    const vtxt = supp?`suppressed (n=${n||0}<${MINN})`:(v==null?'no data':(+v).toFixed(1)+(u||''));
    s+=`<path d="${dp.path}" fill="${fill}" stroke="#fff" stroke-width="0.7" style="cursor:pointer" onclick="pickRegion(this,'${esc(dp.name)}','${vtxt}',${n||0})"><title>${esc(dp.name)}: ${vtxt} · n=${n||0}</title></path>`;});
  return s+'</svg>';
}
function pickRegion(el,name,vtxt,n){
  document.querySelectorAll('.region-sel').forEach(p=>p.classList.remove('region-sel'));
  el.classList.add('region-sel');
  const ro=el.closest('.card').querySelector('.readout'); if(ro) ro.innerHTML=`<b>${esc(name)}</b>: ${esc(vtxt)} &nbsp;·&nbsp; samples n=${n}`;
}
function clearRegions(){document.querySelectorAll('.region-sel').forEach(p=>p.classList.remove('region-sel'));
  document.querySelectorAll('.readout').forEach(r=>r.textContent='Click a region…');}
// clicking anywhere that is NOT a region path clears the highlight
document.addEventListener('click',e=>{ if(!(['path','circle'].includes(e.target.tagName) && e.target.getAttribute('onclick'))) clearRegions(); });
/* ---- horizontal bars (samples per region, or per-unit metric) ---- */
function bars(rows,{w=560,rowH=20,max=null,unit2='',color='var(--s1)',thr=null,fmt=(v=>(''+v))}={}){
  const padL=150,padR=56,padT=6,padB=22; max=max??Math.max(...rows.map(r=>r.v),1); max=max||1;
  const h=padT+rows.length*rowH+padB, iw=w-padL-padR, x=v=>padL+iw*Math.min(v,max)/max;
  let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}">`;
  const step=max<=5?1:max<=10?2:max<=30?5:max<=60?20:max<=200?50:100;
  for(let t=0;t<=max;t+=step){s+=`<line x1="${x(t)}" y1="${padT}" x2="${x(t)}" y2="${h-padB}" stroke="var(--grid)"/><text x="${x(t)}" y="${h-padB+14}" font-size="10" fill="var(--muted)" text-anchor="middle">${t}</text>`;}
  if(thr!=null){s+=`<line x1="${x(thr)}" y1="${padT}" x2="${x(thr)}" y2="${h-padB}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${x(thr)}" y="${padT}" font-size="9.5" fill="var(--red)" text-anchor="middle" dy="-1">${thr}${unit2}</text>`;}
  rows.forEach((r,i)=>{const cy=padT+i*rowH+rowH/2,bw=11,col=r.color||color;
    s+=`<text x="${padL-8}" y="${cy}" font-size="11.5" fill="var(--ink2)" text-anchor="end" dominant-baseline="middle">${esc(r.label)}</text>`;
    s+=`<rect x="${padL}" y="${cy-bw/2}" width="${Math.max(0,x(r.v)-padL)}" height="${bw}" rx="3" fill="${col}"><title>${esc(r.label)}: ${fmt(r.v)}${unit2}</title></rect>`;
    const lab=fmt(r.v),ex=x(r.v)+6,lw=(''+lab).length*6.4; let lx=ex,an='start'; if(lx+lw>w-2){lx=w-3;an='end';}
    s+=`<text x="${lx}" y="${cy}" font-size="11" fill="var(--ink)" dominant-baseline="middle" text-anchor="${an}" font-weight="600">${lab}</text>`;});
  return s+'</svg>';
}
/* ---- graduated-symbol "where sampling happened" map ---- */
function dotmap(nFn,color){
  const m=D.map, mx=Math.max(1,...m.depts.map(dp=>nFn(unit(dp.name))||0));
  let s=`<svg viewBox="${m.viewBox}" width="${m.W}">`;
  m.depts.forEach(dp=>{const n=nFn(unit(dp.name))||0, vt=n?n+' samples':'not sampled';
    s+=`<path d="${dp.path}" fill="#f4f6f8" stroke="#dbe0e5" stroke-width="0.7" style="cursor:pointer" onclick="pickRegion(this,'${esc(dp.name)}','${vt}',${n})"><title>${esc(dp.name)}: ${vt}</title></path>`;});
  m.depts.forEach(dp=>{const n=nFn(unit(dp.name)); if(!n)return; const r=(3+22*Math.sqrt(n/mx)).toFixed(1);
    s+=`<circle cx="${dp.cx}" cy="${dp.cy}" r="${r}" fill="${color}" fill-opacity="0.6" stroke="#fff" stroke-width="1" style="cursor:pointer" onclick="pickRegion(this,'${esc(dp.name)}','${n} samples',${n})"><title>${esc(dp.name)}: ${n} samples</title></circle>`;});
  return s+'</svg>';
}
function dotLegend(nFn,color){const m=D.map, mx=Math.max(1,...m.depts.map(dp=>nFn(unit(dp.name))||0));
  const vals=[mx,Math.max(1,Math.round(mx/2)),Math.max(1,Math.round(mx/6))];
  const R=v=>3+22*Math.sqrt(v/mx), maxR=R(mx), cy=18+maxR, labY=cy+maxR+15;
  let x=12+maxR, s=`<svg viewBox="0 0 360 ${labY+8}" width="360">`;
  s+=`<text x="2" y="12" font-size="11" fill="var(--ink2)">Circle area ∝ QC pass samples</text>`;
  vals.forEach(v=>{const r=R(v);
    s+=`<circle cx="${x}" cy="${cy}" r="${r.toFixed(1)}" fill="${color}" fill-opacity="0.55" stroke="#fff" stroke-width="1"/>`;
    s+=`<text x="${x}" y="${labY}" font-size="11.5" fill="var(--ink)" text-anchor="middle" font-weight="600" style="paint-order:stroke;stroke:#fff;stroke-width:3px">${v}</text>`;
    x+=2*maxR+30;});
  return s+'</svg>';}
// site-level map: real collection-site points (finer than admin-2). valFn/breaks null => sampling map (size by n).
function nBreaks(mx){ // "nice" sample-count bins for the region backdrop
  const step=Math.max(1,Math.ceil(mx/5/10)*10);
  return [0,step,2*step,3*step,4*step,5*step]; }
function siteLegend(color){const S=D.sites||[], mx=Math.max(1,...S.map(t=>t.n||0));
  const vals=[...new Set([mx,Math.max(1,Math.round(mx/2)),Math.max(1,Math.round(mx/6))])];
  const R=v=>3.5+16*Math.sqrt(v/mx), maxR=R(mx), cy=18+maxR, labY=cy+maxR+15;

    x+=2*maxR+30;});

function siteMap(valFn,breaks,cols,u){

// compact year display: contiguous runs use en-dash, non-contiguous entries comma-separated
function fmtYears(ys){
  ys=[...new Set((ys||[]).map(x=>parseInt(x,10)).filter(x=>!isNaN(x)))].sort((a,b)=>a-b);
  if(!ys.length) return '';
  const runs=[]; let s=ys[0],p=ys[0];
  for(let i=1;i<ys.length;i++){ if(ys[i]===p+1){p=ys[i];} else {runs.push([s,p]); s=p=ys[i];} }
  runs.push([s,p]);
  return runs.map(([a,b])=>a===b?`${a}`:`${a}–${b}`).join(', ');
}
// gunzip a base64 gzip payload -> text (client-side, DecompressionStream; no library)
async function gunzipB64(b64){
  const bin=atob(b64); const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  if(typeof DecompressionStream==='undefined') throw new Error('browser lacks DecompressionStream');
  const stream=new Response(bytes).body.pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}

/* Wilson score CI, same formula/constant as gen_reports.wilson(). Needed client-side
   because year- and region-scoped slices are summed here from the per-year atoms; the
   jsdom check asserts this reproduces the Python pooled numbers. */
function wilsonJS(x,n){
  if(!n) return null;
  const Z=1.959963985, p=x/n, d=1+Z*Z/n, c=(p+Z*Z/(2*n))/d,
        h=(Z*Math.sqrt(p*(1-p)/n+Z*Z/(4*n*n)))/d;
  const r=v=>Math.round(v*1000)/10;
  return {est:r(p), lo:r(Math.max(0,c-h)), hi:r(Math.min(1,c+h))};
}

function trSum(src,years,mi){let x=0,d=0,n=0;(years||[]).forEach(y=>{const v=src&&src[y];
  if(v){x+=v.x[mi]||0; d+=v.d[mi]||0; n+=v.n||0;}});return {x,d,n};}
const trNat =(years,mi)=>trSum(TR&&TR.nat,years,mi);
const trUnit=(name,years,mi)=>trSum(TR&&TR.units[name],years,mi);
function trFrames(gran){ if(!TR) return [];

function locationAudit(){

  const dis=(A.coords_vs_name||[]).reduce((s,d)=>s+d.n,0);

  const reg=(A.region_mismatch||[]).reduce((s,d)=>s+d.n,0);

  if(un){

      `${esc(u.name)} (${nf(u.n)}${u.suggest&&u.suggest.length?`, did you mean ${u.suggest.map(esc).join(' / ')}?`:''})`);
    b+=`<li><b>${nf(un)} sample${un===1?'':'s'} could not be placed</b> and are absent from every

  }

        This usually means the boundary file is a different administrative division than the

        file's, not the programme's.</li>`;
  }
  if(dis){

    <ul style="margin:8px 0 0 18px;line-height:1.8">${b}</ul></div>`;

   period, each marker led by its pooled (all years, all areas) row. */
function summaryTable(){
  /* One row per WHO Validated marker and single collection year. No year grouping, no
     all-years row, no marker grouping: every row stands on its own. A marker is listed
     if it reaches the threshold in at least one year. */
  if(!TR) return `<div class="hint" style="margin-top:6px">No per-year data in this dataset.</div>`;
  const vals=D.markers.filter(m=>m.assessed&&m.cls==='validated');
  const out=[];
  vals.forEach(m=>{
    const mi=trIdx(m.key); if(mi<0) return;
    const yrs=[];
    TR.years.forEach(y=>{const t=trNat([y],mi); if(!t.d) return;
      yrs.push({y,n:t.d,w:wilsonJS(t.x,t.d)});});
    if(!yrs.some(r=>r.n>=MINN&&r.w.est>=RES_PCT)) return;    // never reaches the threshold on a usable n
    yrs.forEach(r=>out.push(Object.assign({m},r)));
  });
  if(!out.length) return `<div class="hint" style="margin-top:6px">No WHO Validated marker reaches ${RES_PCT}% in any single year.</div>`;
  out.sort((a,b)=> (b.y.localeCompare(a.y)) || (b.w.est-a.w.est));
  let h=`<div class="scroll"><table><thead><tr><th>Year</th><th>Gene</th><th>AA change</th><th>Associated drug</th><th>WHO Classification</th><th class="num">n tested</th><th class="num">Prevalence</th><th class="num">95% CI</th><th>Flag</th></tr></thead><tbody>`;
  out.forEach(r=>{const m=r.m, small=r.n<MINN;
    h+=`<tr><td>${esc(r.y)}</td><td>${geneLink(m)}</td><td>${esc(m.aa)}</td><td>${esc(m.drug)}</td>`
      +`<td><a class="pill ${clsPill(m)}" href="${WHO_URL}" target="_blank" rel="noopener" style="text-decoration:none" title="${esc((CLSABBR[m.cls]||'')+' = '+clsLabel(m)+(m.who_cls?' \u2014 '+m.who_cls:''))}">${esc(CLSABBR[m.cls]||clsLabel(m))}</a></td>`
      +`<td class="num">${nf(r.n)}</td>`
      +(small?`<td class="num hint" colspan="2">suppressed (n&lt;${MINN})</td><td></td>`
             :`<td class="num">${pct(r.w.est)}</td><td class="num ci-txt">${ci(r.w.lo,r.w.hi)}</td>`
              +`<td>${r.w.est>=RES_PCT?`<span class="pill action">\u2265${RES_PCT}%</span>`:''}</td>`)
      +`</tr>`;});
  return h+`</tbody></table></div><div class="tcap">One row per marker per year, newest first; years in which a marker has no calls are omitted, and years with fewer than ${MINN} samples are suppressed rather than shown as a percentage. See the <a onclick="showTab('trends')" style="cursor:pointer;color:#2a6fb0;text-decoration:underline">Trends</a> tab for the full series and the <a onclick="showTab('resistance')" style="cursor:pointer;color:#2a6fb0;text-decoration:underline">Resistance Markers</a> tab for all-years figures.</div>`;
}
/* Marker-selection grid: gene-grouped chips with per-gene all/none. Used by both the
   Resistance and Trends pages so the control is identical on each. checkedKeys=null
   means every box starts checked. */
function markerToggleGrid(containerId, keys, checkedKeys){
  const grp=[], seen={};
  keys.forEach(k=>{const m=D.markers.find(x=>x.key===k); if(!m) return;
    if(!(m.gene in seen)){seen[m.gene]=grp.length; grp.push({gene:m.gene,gene_id:m.gene_id,items:[]});}
    grp[seen[m.gene]].items.push(m);});
    const on = checkedKeys ? new Set(checkedKeys) : null;
  return `<div class="tgroups" id="${containerId}">`+grp.map((g,gi)=>
    `<div class="tgroup"><div class="tglab"><i>${esc(g.gene)}</i><span class="tgn">${g.items.length} marker${g.items.length>1?'s':''} \u00b7 ${esc(g.gene_id||'')}</span>
       <span class="tgacts"><button class="lnk" data-gsel="${gi}" data-on="1">all</button> / <button class="lnk" data-gsel="${gi}" data-on="0">none</button></span></div>
     <div class="tgrid">`+g.items.map(m=>
      `<label title="${esc(m.gene+' '+m.aa+' \u2014 '+CLSFULL[m.cls]+': '+(m.crit||''))}"><input type="checkbox" data-k="${m.key}" data-g="${gi}"${(!on||on.has(m.key))?' checked':''}><span class="aa">${esc(m.aa)}</span><span class="pill ${clsPill(m)}">${esc(CLSABBR[m.cls]||'?')}</span></label>`).join('')
    +`</div></div>`).join('')+`</div>`;
}
function wireToggleGrid(containerId, onChange){
  document.querySelectorAll(`#${containerId} button.lnk`).forEach(b=>b.onclick=e=>{
    e.preventDefault();
    const onv=b.dataset.on==='1';
    document.querySelectorAll(`#${containerId} input[data-g="${b.dataset.gsel}"]`).forEach(cb=>{
      if(cb.checked!==onv){cb.checked=onv; cb.dispatchEvent(new Event('change'));}});
  });
  document.querySelectorAll(`#${containerId} input[type=checkbox]`)
    .forEach(cb=>cb.addEventListener('change',()=>onChange(cb)));
}
const gridChecked=containerId=>[...document.querySelectorAll(`#${containerId} input[type=checkbox]`)]
  .filter(cb=>cb.checked).map(cb=>cb.dataset.k);

function markerTable(id,summary){
  const rows=D.markers.filter(m=>m.assessed&&(!summary||(m.who&&m.est>=RES_PCT)));
  if(summary&&!rows.length) return `<div class="hint" style="margin-top:6px">No marker listed in the WHO compendium is at or above the ${RES_PCT}% threshold.</div>`;
  return `<div class="scroll"><table${id?` id="${id}"`:''}><thead><tr><th>Gene</th><th>AA change</th><th>Associated drug</th><th>WHO Classification</th><th class="num">Prevalence${summary?' (all years, all areas)':''}</th><th class="num">95% CI</th><th>Flag</th><th>Notes</th></tr></thead><tbody>`+
    rows.map(m=>mkRow(m,summary)).join('')
    +`</tbody></table></div>`+(summary&&TR?`<div class="tcap">Every figure in this table pools all years and all sampled areas. The per-period notes show where each flag actually holds — see the <a onclick="showTab('trends')" style="cursor:pointer;color:#2a6fb0;text-decoration:underline">Trends</a> tab for the full series, or filter by period on <a onclick="showTab('resistance')" style="cursor:pointer;color:#2a6fb0;text-decoration:underline">Resistance Markers</a>.</div>`:'');
}

R.resistance=()=>{
  const cm=(CAP.covered_markers||[]).filter(k=>D.markers.find(m=>m.key===k&&m.assessed));

          TR.years.length>TR.frames.length?`<optgroup label="Single years">${TR.years.map(y=>`<option value="y:${y}">${y} (n=${TR.year_n[y]||0})</option>`).join('')}</optgroup>`:''}</select></label>`:''}

function wireResistance(){
  const sel=$('#drsel'), slider=$('#minslider'); if(!sel) return;
  const draw=()=>{const k=sel.value;
    const src=D.units.filter(u=>unitNsel(u)>0);
    const vals=src.filter(o=>unitPrev(o,k)!=null&&unitNsel(o)>=MINN).map(o=>unitPrev(o,k));
    const mx=Math.max(2,...vals); const breaks=mx<=10?[0,1,2,5,10,20,100]:[0,2,5,10,20,50,100];
    // detail pages: admin-2 CHOROPLETH only (no circles)
    $('#drmap').innerHTML = choropleth(u=>unitPrev(u,k),u=>unitNsel(u),breaks,RED,'%');
    $('#drlegend').innerHTML=binnedLegend(breaks,RED,'%',RES_PCT);
    // sample bars (sorted desc by n) — per admin-2
    const rows=src.slice().sort((a,b)=>unitNsel(b)-unitNsel(a)).slice(0,20)
      .map(o=>({label:o.name,v:unitNsel(o),color:(unitNsel(o)<MINN?'#c9ccd1':'var(--s1)')}));
    $('#drbars').innerHTML=bars(rows,{thr:MINN,unit2:'',w:560});
    const plab=YSEL?`${selLabel||'selected period'} only`:'all years (pooled)';
    ['#drperiod','#mtperiod','#drbarperiod'].forEach(id=>{const el=$(id);
      if(el){el.textContent=plab; el.classList.toggle('filtered',!!YSEL);}});
    const note=$('#yrnote');
    if(note){const lab=YSEL?(selLabel||'selection'):'all years (pooled)';
      const tot=src.reduce((a,o)=>a+unitNsel(o),0), supp=src.filter(o=>unitNsel(o)<MINN).length;
      note.innerHTML=`Showing <b>${esc(lab)}</b>: ${nf(tot)} QC pass samples across ${src.length} sampled admin-2 unit${src.length===1?'':'s'}`
        +(supp?` \u00b7 ${supp} unit${supp===1?'':'s'} suppressed at n&lt;${MINN}`:'')
        +(YSEL?` \u00b7 <a onclick="document.getElementById('yrsel').value='';document.getElementById('yrsel').dispatchEvent(new Event('change'))" style="cursor:pointer;color:#2a6fb0;text-decoration:underline">reset to pooled</a>`:'');}
  };
  let selLabel='';
  sel.onchange=draw;
  slider.oninput=()=>{MINN=+slider.value; $('#minlab').textContent=MINN; draw();};
  const ysel=$('#yrsel');
  if(ysel) ysel.onchange=()=>{
    const v=ysel.value;
    if(!v){YSEL=null; selLabel='';}
    else if(v.startsWith('f:')){const f=TR.frames.find(x=>x.key===v.slice(2)); YSEL=f?f.years:null; selLabel=f?f.label:'';}
    else {YSEL=[v.slice(2)]; selLabel=v.slice(2);}
    draw(); rebuildTable(); refreshDL();
  };
  // marker toggles filter table rows + selector options
  wireToggleGrid('mtoggles', cb=>{
    const k=cb.dataset.k, on=cb.checked;
    document.querySelectorAll(`#mtable tr[data-k="${k}"]`).forEach(r=>r.style.display=on?'':'none');
    const opt=sel.querySelector(`option[value="${k}"]`); if(opt) opt.disabled=!on;
    if(!on && sel.value===k){const first=[...sel.options].find(o=>!o.disabled); if(first){sel.value=first.value; draw();}}
  });
  // marker-table widget: filter (WHO/research/threshold/min-prevalence) + sort by prevalence
  const mtf=$('#mtfilter'), mts=$('#mtsort'), mtp=$('#mtminprev');
  const toggledOff=()=>new Set([...document.querySelectorAll('#mtoggles input')].filter(cb=>!cb.checked).map(cb=>cb.dataset.k));
  const rebuildTable=()=>{
    let rows=D.markers.filter(m=>m.assessed);
    // prevalence-based filters/sorts follow the selected period, not the pooled value
    const pv=m=>{const st=mkStat(m.key); return st?st.est:null;};
    if(mtf.value==='who') rows=rows.filter(m=>m.who);
    else if(mtf.value==='action') rows=rows.filter(m=>(pv(m)??-1)>=RES_PCT);
    else if(mtf.value!=='all') rows=rows.filter(m=>m.cls===mtf.value);
    const minp=parseFloat(mtp.value)||0; if(minp>0) rows=rows.filter(m=>(pv(m)??-1)>=minp);
    if(mts.value==='desc') rows=rows.slice().sort((a,b)=>(pv(b)??-1)-(pv(a)??-1));
    else if(mts.value==='asc') rows=rows.slice().sort((a,b)=>(pv(a)??999)-(pv(b)??999));
    const off=toggledOff();
    let out;
    if(!YSEL){ out=rows.map(m=>mkRow(m,false)); }
    else {
      out=[];
      rows.forEach(m=>{const st=mkStat(m.key);
        out.push(st?mkRow(m,false,st)
                   :`<tr data-k="${m.key}"><td><i>${esc(m.gene)}</i></td><td>${esc(m.aa)}</td><td>${esc(m.drug)}</td>`
                    +`<td><span class="pill ${clsPill(m)}">${esc(clsLabel(m))}</span></td>`
                    +`<td class="num hint" colspan="3">not assessed in ${esc(selLabel||'this period')}</td>`
                    +`<td class="sub2" style="margin:0">${noteFor(m)}</td></tr>`);});
    }
    $('#mtable tbody').innerHTML=out.join('')||`<tr><td colspan="8" class="hint">No markers match the current filter.</td></tr>`;
    document.querySelectorAll('#mtable tr[data-k]').forEach(r=>{if(off.has(r.dataset.k)) r.style.display='none';});
  };
  mtf.onchange=rebuildTable; mts.onchange=rebuildTable; mtp.oninput=rebuildTable;
  // clicking a marker row shows that marker on the prevalence map
  $('#mtable').addEventListener('click',e=>{
    const tr=e.target.closest('tr[data-k]'); if(!tr) return;
    const k=tr.dataset.k, opt=sel.querySelector(`option[value="${k}"]`);
    if(!opt||opt.disabled) return;
    sel.value=k; draw();
    document.querySelectorAll('#mtable tr').forEach(r=>r.classList.remove('region-sel'));
    tr.classList.add('region-sel');
    const mapCard=$('#drmap').closest('.card'); if(mapCard&&mapCard.scrollIntoView) mapCard.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
  // download
  const mkDL=()=>D.markers.filter(m=>m.assessed).map(m=>{const st=mkStat(m.key)||{};
    return {period:(YSEL?selLabel:'all years (pooled)'),gene:m.gene,aa_change:m.aa,drug:m.drug,
            marker_class:m.category,prevalence_pct:(st.est??''),ci_low:(st.lo??''),ci_high:(st.hi??''),
            n:(st.n??''),positive:(st.x??'')};});
  const refreshDL=()=>{$('#dltbl').innerHTML=csvDL('resistance_markers.csv',mkDL());};
  refreshDL();
  draw();
}



/* ================= TRENDS ================= */
const DIVC=['#2166ac','#67a9cf','#d1e5f0','#fddbc7','#ef8a62','#b2182b'];   // falling -> rising
const DIVBR=[-100,-20,-5,0,5,20,100];
// categorical line chart with a 95% CI band for the focus series
function trendChart(frames,series,{w=620,h=250,ymax=null}={}){
  const padL=46,padR=14,padT=12,padB=38, iw=w-padL-padR, ih=h-padT-padB;
  const n=frames.length;
  const X=i=>padL+(n===1?iw/2:iw*i/(n-1));
  let top=ymax;
  if(top==null){ const vs=[]; series.forEach(s=>s.pts.forEach(p=>{if(p)vs.push(p.hi!=null?p.hi:p.est);}));
    top=Math.max(5,...vs); top=top<=10?10:top<=25?25:top<=50?50:100; }
  const Y=v=>padT+ih-ih*Math.min(v,top)/top;
  let o=`<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img">`;
  const ticks=[0,top/4,top/2,3*top/4,top];
  ticks.forEach(t=>{o+=`<line x1="${padL}" y1="${Y(t)}" x2="${w-padR}" y2="${Y(t)}" stroke="var(--grid)"/>`
    +`<text x="${padL-6}" y="${Y(t)}" font-size="10" fill="var(--muted)" text-anchor="end" dominant-baseline="middle">${t%1?t.toFixed(1):t}%</text>`;});
  if(top>=RES_PCT) o+=`<line x1="${padL}" y1="${Y(RES_PCT)}" x2="${w-padR}" y2="${Y(RES_PCT)}" stroke="var(--red)" stroke-width="1.3" stroke-dasharray="4 3"/>`
    +`<text x="${w-padR}" y="${Y(RES_PCT)-4}" font-size="9.5" fill="var(--red)" text-anchor="end">${RES_PCT}% action threshold</text>`;
  const every=n>8?Math.ceil(n/8):1;
  frames.forEach((f,i)=>{ if(i%every) return;
    o+=`<text x="${X(i)}" y="${h-padB+15}" font-size="10" fill="var(--ink2)" text-anchor="middle">${esc(f.label)}</text>`;});
  series.filter(s=>s.faint).forEach(s=>{
    const pts=s.pts.map((p,i)=>p?`${X(i)},${Y(p.est)}`:null).filter(Boolean);
    if(pts.length>1) o+=`<polyline points="${pts.join(' ')}" fill="none" stroke="#c3c9d2" stroke-width="1"/>`;});
  series.filter(s=>!s.faint).forEach(s=>{
    const idx=s.pts.map((p,i)=>p?i:-1).filter(i=>i>=0);
    if(s.band&&idx.length){
      const up=idx.map(i=>`${X(i)},${Y(s.pts[i].hi)}`), dn=idx.slice().reverse().map(i=>`${X(i)},${Y(s.pts[i].lo)}`);
      o+=`<polygon points="${up.concat(dn).join(' ')}" fill="${s.color}" fill-opacity="0.15"/>`;
    }
    const pts=idx.map(i=>`${X(i)},${Y(s.pts[i].est)}`);
    if(pts.length>1) o+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    idx.forEach(i=>{const p=s.pts[i];
      o+=`<circle cx="${X(i)}" cy="${Y(p.est)}" r="${pts.length===1?4.5:3.6}" fill="${s.color}" stroke="#fff" stroke-width="1.2">`
        +`<title>${esc(frames[i].label)}: ${p.est}% (95% CI ${p.lo}–${p.hi}%), ${p.x}/${p.n}</title></circle>`;});
  });
  return o+'</svg>';
}
R.trends=()=>{
  if(!TR) return `<h2 class="sec">Trends in AMR markers over time</h2><div class="callout"><b>No time-resolved data.</b></div>`;
  const cm=(CAP.covered_markers||[]).filter(k=>D.markers.find(m=>m.key===k&&m.assessed)&&trIdx(k)>=0);
  const dflt=(D.markers.filter(m=>m.assessed&&m.action).sort((a,b)=>b.est-a.est)[0]
            ||D.markers.filter(m=>m.assessed&&m.who).sort((a,b)=>b.est-a.est)[0]||{}).key||cm[0];
  return `<h2 class="sec">Trends in AMR markers over time</h2>
    <div class="sec-desc">Antimicrobial resistance (AMR) marker prevalence over time and space. Years with few samples are merged into larger periods of time for ease-of-visualization (switch to single years to see the raw series).</div>
    ${classLegend()}
    <div class="sec-desc" style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">

    ${markerToggleGrid('trtoggles', cm, [dflt])}
    <div class="controls">
      <label>Map shows: <select id="trmapsel"></select></label>

      <label>Min samples/region: <b id="trminlab">${MINN}</b> <input type="range" id="trmin" min="1" max="30" value="${MINN}"></label>
      <span id="trscope"></span>
    </div>
    <div class="grid two" style="margin-top:4px">
      <div class="card"><h3 id="trtitle">Prevalence over time</h3>
        <div class="hint">Shaded band = 95% Wilson CI. Faint grey lines are the other WHO compendium markers for context. Hover a point for n.</div>
        <div id="trchart"></div></div>
      <div class="card" tabindex="0" id="trmapcard"><h3>Map by period <span class="sub" id="trmaplab"></span></h3>
        <div class="hint">Step with the arrows (or ←/→ keys when this card is focused) to flicker between consecutive periods. Click a region to scope the chart and table to it.</div>
        <div class="stepbar">
          <button class="step" id="trprev" title="Previous period">◀</button>
          <div><div class="frame" id="trframe"></div><div class="sub" id="trframen"></div></div>
          <button class="step" id="trnext" title="Next period">▶</button>
          <button class="step" id="trplay" title="Play / pause">▶ Play</button>
          <button class="step" id="trdiff" title="Show change vs previous period">Δ vs previous</button>
        </div>
        <div id="trmap"></div><div id="trlegend"></div><div class="readout" id="trreadout">Click a region…</div></div>
    </div>
    <div class="grid" style="margin-top:16px">
      <div class="card"><h3>Samples per period</h3><div class="hint">Number of samples collected (n) per period; the current period is highlighted.</div><div id="trbars"></div></div>
      <div class="card"><h3 id="trtbltitle">By period</h3><div class="hint" id="trdl"></div><div id="trtable"></div></div>
    </div>`;
};
function wireTrends(){
  if(!TR) return;
  const gran=$('#trgran'), mn=$('#trmin');
  if(!gran) return;
  const allKeys=[...document.querySelectorAll('#trtoggles input[type=checkbox]')].map(cb=>cb.dataset.k);
  const TRCOL=['#2a78d6','#d03b3b','#1baf7a','#9a5b16','#6f42c1','#0b7285','#c2185b','#5b6067'];
  const picked=()=>gridChecked('trtoggles');
  /* The map can only show one marker at a time, so which one is an explicit choice rather
     than "whichever selected marker happens to sort first" - that silently hijacked the
     map whenever a marker earlier in the catalogue was added. */
  const mapSel=$('#trmapsel');
  let mapKey=picked()[0], mapOpts='';
  const mapKeyNow=()=>{const ks=picked(); if(!ks.includes(mapKey)) mapKey=ks[0]; return mapKey;};
  const syncMapSel=()=>{
    const ks=picked(), want=ks.join('|');
    if(want!==mapOpts){
      mapOpts=want;
      mapSel.innerHTML=ks.map(k=>`<option value="${k}">${esc(markerLabel(D.markers.find(x=>x.key===k)||{}))}</option>`).join('');
    }
    mapSel.value=mapKeyNow();
  };
  let idx=0, diff=false, timer=null, scope=null;     // scope=null -> national
  const frames=()=>trFrames(gran.value);
  const stat=(years,mi)=>scope?trUnit(scope,years,mi):trNat(years,mi);
  const series=(mi)=>frames().map(f=>{const t=stat(f.years,mi);
    return t.d?Object.assign({x:t.x,n:t.d},wilsonJS(t.x,t.d)):null;});
  const binsFor=mi=>{                                 // fixed across every frame
    const vs=[]; frames().forEach(f=>D.units.forEach(u=>{const t=trUnit(u.name,f.years,mi);
      if(t.d&&t.n>=MINN) vs.push(100*t.x/t.d);}));
    const mx=Math.max(2,...vs); return mx<=10?[0,1,2,5,10,20,100]:[0,2,5,10,20,50,100];
  };
  const draw=()=>{
    const keys=picked();
    if(!keys.length){
      const fs0=frames();
      if(idx>=fs0.length) idx=fs0.length-1; if(idx<0) idx=0;
      mapOpts=''; mapSel.innerHTML='';
      $('#trbars').innerHTML=bars(fs0.map((x,i)=>({label:x.label,
          v:(scope?x.years.reduce((a,y)=>a+trUnit(scope,[y],0).n,0):x.years.reduce((a,y)=>a+(TR.year_n[y]||0),0)),
          color:i===idx?'var(--accent)':'var(--s1)'})),{w:1080});
      const none=`<div class="hint" style="padding:6px 0">No markers selected \u2014 choose one or more above.</div>`;
      $('#trchart').innerHTML=none; $('#trtable').innerHTML=none;
      $('#trmap').innerHTML=''; $('#trlegend').innerHTML=''; $('#trdl').innerHTML='';
      $('#trtitle').textContent='Prevalence over time';
      $('#trtbltitle').textContent='By period';
      $('#trmaplab').textContent=''; $('#trframe').textContent=fs0[idx]?fs0[idx].label:'\u2014';
      $('#trframen').textContent='';
      $('#trprev').disabled=idx===0; $('#trnext').disabled=idx===fs0.length-1;
      return;
    }
    syncMapSel();
    const key=mapKeyNow(), mi=trIdx(key), fs=frames();
    if(idx>=fs.length) idx=fs.length-1; if(idx<0) idx=0;
    const f=fs[idx], prev=idx>0?fs[idx-1]:null;
    const m=D.markers.find(x=>x.key===key)||{};
    const single=keys.length===1;
    const ser=keys.map((k,i)=>({pts:series(trIdx(k)),color:TRCOL[i%TRCOL.length],band:single,
                                label:markerLabel(D.markers.find(x=>x.key===k)||{})}));
    if(single&&!scope) D.markers.filter(x=>x.assessed&&x.who&&x.key!==key).slice(0,24).forEach(x=>{
      const j=trIdx(x.key); if(j>=0) ser.push({pts:series(j),faint:true});});
    $('#trtitle').innerHTML=single
      ? `${esc((m.gene||'')+' '+(m.aa||''))} — ${esc(scope?scope:'national')} prevalence over time`
      : `${keys.length} markers — ${esc(scope?scope:'national')} prevalence over time`;
    $('#trchart').innerHTML=trendChart(fs,ser)
      +(single?'':`<div class="legend">`+ser.filter(x=>!x.faint).map(x=>`<span class="k"><span class="sw" style="background:${x.color}"></span>${esc(x.label)}</span>`).join('')+`</div>`);
    const br=diff?DIVBR:binsFor(mi), cols=diff?DIVC:RED;
    const val=u=>{ if(!u) return null;
      const t=trUnit(u.name,f.years,mi); if(!t.d||t.n<MINN) return null;
      const now=100*t.x/t.d;
      if(!diff) return now;
      if(!prev) return null;
      const q=trUnit(u.name,prev.years,mi); if(!q.d||q.n<MINN) return null;
      return now-100*q.x/q.d; };
    $('#trmap').innerHTML=choropleth(val,u=>u?trUnit(u.name,f.years,mi).n:0,br,cols,diff?' pp':'%');
    $('#trlegend').innerHTML=binnedLegend(br,cols,diff?' pp':'%',diff?null:RES_PCT);
    $('#trframe').textContent=f.label;
    const fn=f.years.reduce((a,y)=>a+(TR.year_n[y]||0),0);
    $('#trframen').textContent=`n=${nf(fn)} · frame ${idx+1}/${fs.length}`;
    $('#trmaplab').textContent=`— ${(m.gene||'')+' '+(m.aa||'')} `
      +(diff?(prev?`Δ ${f.label} vs ${prev.label} (percentage points)`:'(no previous period)'):'');
    $('#trprev').disabled=idx===0; $('#trnext').disabled=idx===fs.length-1;
    $('#trdiff').classList.toggle('on',diff);
    $('#trscope').innerHTML=scope?`<span class="scopechip">scope: ${esc(scope)}</span> <button class="lnk" id="trclear">national</button>`:`<span class="scopechip">scope: national</span>`;
    const cl=$('#trclear'); if(cl) cl.onclick=()=>{scope=null; clearRegions(); draw();};
    $('#trbars').innerHTML=bars(fs.map((x,i)=>({label:x.label,
        v:(scope?x.years.reduce((a,y)=>a+trUnit(scope,[y],0).n,0):x.years.reduce((a,y)=>a+(TR.year_n[y]||0),0)),
        color:i===idx?'var(--accent)':'var(--s1)'})),{w:1080});
    const sr=series(mi);
    let rows;
    if(single){
      rows=`<div class="scroll"><table><thead><tr><th>Period</th><th class="num">n tested</th><th class="num">carrying</th><th class="num">Prevalence</th><th class="num">95% CI</th><th class="num">Δ vs prev</th><th>Flag</th></tr></thead><tbody>`;
      sr.forEach((p,i)=>{const pr=i>0?sr[i-1]:null;
        const dv=(p&&pr)?(p.est-pr.est):null;
        rows+=`<tr${i===idx?' class="region-sel"':''}><td>${esc(fs[i].label)}</td>`
          +(p?`<td class="num">${nf(p.n)}</td><td class="num">${nf(p.x)}</td><td class="num">${pct(p.est)}</td><td class="num ci-txt">${ci(p.lo,p.hi)}</td>`
             +`<td class="num">${dv==null?'—':(dv>0?'+':'')+dv.toFixed(1)+' pp'}</td>`
             +`<td>${(m.cls==='validated'&&p.est>=RES_PCT)?`<span class="pill action">≥${RES_PCT}%</span>`:''}</td>`
            :`<td class="num hint" colspan="5">not assessed</td><td></td>`)+`</tr>`;});
      rows+=`</tbody></table></div>`;
    } else {
      const cols=keys.map(k=>({k,lab:markerLabel(D.markers.find(x=>x.key===k)||{}),s:series(trIdx(k))}));
      rows=`<div class="scroll"><table><thead><tr><th>Period</th>`+cols.map(c=>`<th class="num">${esc(c.lab)}</th>`).join('')+`</tr></thead><tbody>`;
      fs.forEach((fr,i)=>{rows+=`<tr${i===idx?' class="region-sel"':''}><td>${esc(fr.label)}</td>`
        +cols.map(c=>{const q=c.s[i]; return `<td class="num">${q?pct(q.est)+` <span class="ci-txt">(${q.x}/${q.n})</span>`:'<span class="hint">n/a</span>'}</td>`;}).join('')+`</tr>`;});
      rows+=`</tbody></table></div>`;
    }
    $('#trtable').innerHTML=rows;
    $('#trtbltitle').textContent=single?`${m.gene||''} ${m.aa||''} by period — ${scope?scope:'national'}`
                                      :`${keys.length} markers by period — ${scope?scope:'national'}`;
    const dlrows=[];
    keys.forEach(k=>{const mm=D.markers.find(x=>x.key===k)||{}, ss=series(trIdx(k));
      fs.forEach((x,i)=>dlrows.push({period:x.label,years:x.years.join(' '),scope:scope||'national',
        marker:`${mm.gene} ${mm.aa}`,who_class:mm.category||'',
        n_tested:(ss[i]?ss[i].n:''),carrying:(ss[i]?ss[i].x:''),prevalence_pct:(ss[i]?ss[i].est:''),
        ci_low:(ss[i]?ss[i].lo:''),ci_high:(ss[i]?ss[i].hi:'')}));});
    $('#trdl').innerHTML=csvDL(`trend_${scope?scope.replace(/\W+/g,'_'):'national'}.csv`,dlrows);
  };
  const step=d=>{const fs=frames(); idx=Math.max(0,Math.min(fs.length-1,idx+d)); draw();};
  $('#trprev').onclick=()=>step(-1); $('#trnext').onclick=()=>step(1);
  $('#trdiff').onclick=()=>{diff=!diff; draw();};
  $('#trplay').onclick=()=>{
    if(timer){clearInterval(timer); timer=null; $('#trplay').innerHTML='▶ Play'; $('#trplay').classList.remove('on'); return;}
    $('#trplay').innerHTML='❚❚ Pause'; $('#trplay').classList.add('on');
    timer=setInterval(()=>{const fs=frames(); idx=(idx+1)%fs.length; draw();},1100);
  };
  $('#trmapcard').addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){e.preventDefault(); step(-1);}
    else if(e.key==='ArrowRight'){e.preventDefault(); step(1);}});
  $('#trmap').addEventListener('click',e=>{
    const el=e.target.closest('path[onclick]'); if(!el) return;
    const t=el.querySelector('title'); if(!t) return;
    const nm=t.textContent.split(':')[0].trim();
    scope=(scope===nm)?null:nm; draw();});
  wireToggleGrid('trtoggles', ()=>draw());
  mapSel.onchange=()=>{mapKey=mapSel.value; draw();};
  const setAll=on=>{document.querySelectorAll('#trtoggles input[type=checkbox]').forEach(cb=>cb.checked=on); draw();};
  $('#trselall').onclick=()=>setAll(true);
  $('#trclearall').onclick=()=>setAll(false);
  gran.onchange=()=>{idx=0; draw();};
  mn.oninput=()=>{MINN=+mn.value; $('#trminlab').textContent=MINN; draw();};
  draw();
}
R.export=()=>{
  const e=D.export, order=e.order||Object.keys(e.views||{});
  const NUMWORD={1:'One',2:'Two',3:'Three',4:'Four',5:'Five',6:'Six'};
  const fmtNames=order.map(k=>esc(e.views[k].label||k));
  let html=`<h2 class="sec">Export data for dashboards</h2>
    <div class="sec-desc">This dataset reformatted for easy import into downstream dashboards. ${NUMWORD[fmtNames.length]||fmtNames.length} data formats currently supported: ${fmtNames.join(', ')}.</div>
    <div class="controls"><label>Output type: <select id="expsel">`+order.map(k=>`<option value="${k}">${esc(e.views[k].label||k)}</option>`).join('')+`</select></label></div>
    <div id="exportview"></div>`;
  return html;
};
function wireExport(){
  const V=(D.export&&D.export.views)||{}, order=(D.export&&D.export.order)||Object.keys(V);
  const render=key=>{const v=V[key]||{cols:[],count:0,preview:[]};
    const rows=v.preview||[], cols=(v.cols&&v.cols.length)?v.cols:Object.keys(rows[0]||{a:1});
    let h=`<div class="card"><h3>${esc(v.title||key)}</h3>`
      +`<div class="hint"><button class="btn" id="dlbtn">\u2913 Download full CSV (${v.count} rows)</button>`
      +(v.count>rows.length?`<div style="color:var(--ink2);margin-top:8px">Table shows the first ${rows.length} of ${v.count} rows; download for the full set.</div>`:``)+`</div>`
      +`<div class="scroll"><table><thead><tr>`+cols.map(c=>`<th>${esc(c)}</th>`).join('')+`</tr></thead><tbody>`
      +rows.map(r=>`<tr>`+cols.map(c=>`<td>${esc(r[c])}</td>`).join('')+`</tr>`).join('')+`</tbody></table></div></div>`;
    $('#exportview').innerHTML=h;
    const b=$('#dlbtn'); if(b) b.onclick=()=>downloadCSVgz(v.gz,v.name||(key+'.csv'));
  };
  const xs=$('#expsel'); if(xs) xs.onchange=()=>render(xs.value);
  render(order[0]);
}

R.methods=()=>{
  const who='https://www.who.int/publications/m/item/compendium-of-molecular-markers-for-antimalarial-drug-resistance';
  const flagged=D.markers.filter(m=>m.assessed&&m.action);
  return `<h2 class="sec">Methods &amp; notes</h2>
    <div class="sec-desc">Definitions, thresholds, and sources for the figures in this report.</div>

    <div class="grid two">
      <div class="card"><h3>Data and scope</h3>
        <table>
          <tr><td>Assay</td><td><b>${esc(M.assay_full)}</b></td></tr>
          <tr><td>Platform</td><td>${esc(M.platform)}</td></tr>
          <tr><td>Samples (QC pass)</td><td><b>${nf(M.n_qc)}</b>${(M.n_called!=null&&M.n_called!==M.n_qc)?`, of which ${nf(M.n_called)} returned at least one marker call`:''}</td></tr>
          <tr><td>Collection years</td><td>${esc(M.period)}</td></tr>
          <tr><td>Coverage</td><td>${M.n_units_sampled} of ${M.n_units_total} ${UNITS}${D.sites&&D.sites.length?`, ${D.sites.length} collection sites`:''}</td></tr>
          <tr><td>Markers reported</td><td>${D.markers.filter(m=>m.assessed).length}</td></tr>
          ${REAL?`<tr><td>Source</td><td>${esc(M.data_source||'')}</td></tr>`:''}
        </table>
      </div>
      <div class="card"><h3>Prevalence and confidence intervals</h3>
        <p style="font-size:13.5px;color:var(--ink2)">Prevalence is the proportion of infections carrying a marker among those successfully genotyped at that
        marker &mdash; a proportion of samples tested, not a case count or incidence rate. Denominators differ slightly between markers because genotyping does not
        succeed at every locus in every sample.</p>
        <p style="font-size:13.5px;color:var(--ink2);margin-top:8px">Intervals are 95% confidence intervals by the Wilson score method, which remains well behaved
        near 0% and 100% where the standard normal approximation does not. Prevalence is suppressed where fewer than <b>${MINN}</b> samples were genotyped
        (adjustable via the min-samples control). A marker with no calls in a given scope reads <i>not assessed</i>, which is distinct from 0%.</p>
      </div>
    </div>

    <div class="card" style="margin-top:16px"><h3>Marker classes</h3>
      <p style="font-size:13.5px;color:var(--ink2)">Classes are taken from the
      <a href="${who}" target="_blank" rel="noopener">WHO Compendium of molecular markers for antimalarial drug resistance</a> and reflect the evidence WHO records for
      each alteration. WHO's evidence qualifiers (for example &ldquo;Epi., Lab. &amp; Clin.&rdquo;) appear in the Notes column.</p>
      <ul style="font-size:13px;color:var(--ink2);margin:8px 0 0 18px;line-height:1.75">
        <li><b>Validated marker</b> &mdash; epidemiological, laboratory, and clinical evidence of association with reduced treatment response.</li>
        <li><b>Candidate marker</b> &mdash; some but not all of those lines of evidence; under WHO assessment.</li>
        <li><b>Potential marker</b> &mdash; limited evidence, typically laboratory only.</li>
        <li><b>Haplotype component</b> &mdash; WHO lists the codon only within a multi-codon haplotype, which the Notes column names; the codon alone carries no WHO class.</li>
        <li><b>Background</b> &mdash; a locus on this panel that WHO does not list as a resistance marker, reported for interpretation and research.</li>
      </ul>
    </div>

    <div class="grid two" style="margin-top:16px">
      <div class="card"><h3>Action threshold</h3>
        <p style="font-size:13.5px;color:var(--ink2)">Validated markers at or above <b>${RES_PCT}%</b> are flagged, corresponding to WHO's ${RES_PCT}% treatment-failure
        threshold for reviewing first-line treatment. Marker prevalence and treatment failure are related but distinct measures, so a flag indicates where further
        investigation &mdash; a therapeutic efficacy study &mdash; is warranted rather than confirming clinical failure.
        ${flagged.length?`Flagged here: ${flagged.map(m=>esc(m.gene+' '+m.aa)+' ('+pct(m.est)+')').join(', ')}.`:'No marker is flagged in this dataset.'}</p>
      </div>
      <div class="card"><h3>Year-by-year figures</h3>
        <p style="font-size:13.5px;color:var(--ink2)">Sparse years are grouped into periods so each figure has a usable denominator; a year with
        ${TR?nf(TR.min_frame_n):100} or more QC pass samples stands alone. Periods are summed from per-year counts and always reconcile with the all-years figures.
        Single years are available via the granularity control.</p>
        <p style="font-size:13.5px;color:var(--ink2);margin-top:8px">District coverage varies between years, so part of any change in a national figure reflects which
        districts contributed samples rather than change in the parasite population. Samples per period are shown alongside each trend, and scoping to one district
        removes that composition effect.</p>
      </div>
    </div>

    <div class="grid two" style="margin-top:16px">
      <div class="card"><h3>Sources</h3>
        <ul style="font-size:13px;color:var(--ink2);margin:6px 0 0 18px;line-height:1.9">
          <li>Marker list and classes: <a href="${who}" target="_blank" rel="noopener">WHO Compendium of molecular markers for antimalarial drug resistance</a></li>
          <li>District boundaries: geoBoundaries, Senegal admin level 2</li>
          <li>Gene names link to the corresponding PlasmoDB record</li>
        </ul>
      </div>
      <div class="card"><h3>Pipelines</h3>
        <ul style="font-size:13px;color:var(--ink2);margin:6px 0 0 18px;line-height:1.9">${(M.links||[]).map(l=>`<li><a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a></li>`).join('')||'<li>&mdash;</li>'}</ul>
      </div>
    </div>

    ${qcCard()}
    ${panelCard()}
    ${locationAudit()}
    ${M.sample_selection?`<div class="callout amber" style="margin-top:14px"><b>Selected samples only.</b> This report covers a selected subset (<b>${esc(M.sample_selection)}</b>):
      ${nf(M.n_matched)} of ${nf(M.n_requested)} requested samples were found${M.n_requested_missing?`, ${nf(M.n_requested_missing)} were not`:''}.
      All counts and prevalences refer to that subset.</div>`:''}
    ${REAL?'':`<div class="callout amber" style="margin-top:14px"><b>Data status.</b> Design mock-up (${M.version}). Thresholds, WHO classes, and marker lists are real; prevalence values are synthetic and must not be used.</div>`}`;
};

$('#footer').innerHTML=`Malaria Molecular Surveillance — ${esc(M.country)} · ${esc(M.assay_full)} · ${M.period} · ${M.version} (${REAL?'real data':'synthetic data'}).`;
