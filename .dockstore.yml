version: 1.2

# Dockstore registers each pipeline separately so Terra can import them one at a time.
# Relative imports (../../tasks/...) resolve because Dockstore pulls the whole repository;
# importing a raw GitHub URL into Terra would not resolve them.
workflows:
  - name: MalariaSurveillanceReportAmplicon
    subclass: WDL
    primaryDescriptorPath: /wdl/pipelines/ILMN/Malaria/MalariaSurveillanceReportAmplicon.wdl
    readMePath: /docs/workflows/MalariaSurveillanceReportAmplicon.README.md
    testParameterFiles:
      - /wdl/inputs/MalariaSurveillanceReportAmplicon.inputs.json


  - name: MalariaSurveillanceReportWgs
    subclass: WDL
    primaryDescriptorPath: /wdl/pipelines/ILMN/Malaria/MalariaSurveillanceReportWgs.wdl
    readMePath: /docs/workflows/MalariaSurveillanceReportWgs.README.md
    testParameterFiles:
      - /wdl/inputs/MalariaSurveillanceReportWgs.inputs.json

  - name: MalariaSurveillanceReportNomads
    subclass: WDL
    primaryDescriptorPath: /wdl/pipelines/ONT/Malaria/MalariaSurveillanceReportNomads.wdl
    readMePath: /docs/workflows/MalariaSurveillanceReportNomads.README.md
    testParameterFiles:
      - /wdl/inputs/MalariaSurveillanceReportNomads.inputs.json
